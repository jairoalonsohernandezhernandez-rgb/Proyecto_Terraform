apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio-app
  labels:
    app: portfolio-backend
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: portfolio-backend
  template:
    metadata: 
      labels: 
        app: portfolio-backend
    spec: 
      serviceAccountName: portafolio-sa
      containers: 
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: PORT
          value: "80" 
        - name: GCP_PROJECT_ID
          value: "portfolio-dev-local"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe: 
          httpGet: 
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe: 
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5